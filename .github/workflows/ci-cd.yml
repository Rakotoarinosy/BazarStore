# CI/CD BazarStore
#   Pull request → tests backend + build frontend.
#   Push sur main → tests, images Docker (GHCR), déploiement sur le VPS, vérification HTTPS.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   VPS_HOST, VPS_USER, VPS_PRIVATE_KEY   (mêmes noms que le projet AndaoHiasa)
#   VPS_PORT                              (facultatif, 22 par défaut)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/rakotoarinosy/bazarstore-backend
  FRONTEND_IMAGE: ghcr.io/rakotoarinosy/bazarstore-frontend
  DEPLOY_PATH: /srv/BazarStore
  SITE_URL: https://bazarstore.rakotoarinosy.com
  API_URL: https://api.bazarstore.rakotoarinosy.com

# Un seul déploiement à la fois ; une PR plus récente annule l'ancienne vérification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Dépendances (uv.lock)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Tests (pytest)
        # Tests hérités de l'ancien projet (agents, demandes…) et tests utilisateurs à réécrire :
        # exclus tant qu'ils ne sont pas mis à jour ou supprimés. Tout le reste doit passer.
        run: >-
          uv run pytest -q
          --ignore=tests/e2e/api/test_agents_api.py
          --ignore=tests/e2e/api/test_citizen_requests_api.py
          --ignore=tests/e2e/api/test_demandes_api.py
          --ignore=tests/e2e/api/test_documentation_api.py
          --ignore=tests/e2e/api/test_request_analysis_api.py
          --ignore=tests/e2e/api/test_users_api.py
          --ignore=tests/integration/infrastructure/test_user_repository.py
          --ignore=tests/unit/features/test_create_user.py
          --ignore=tests/unit/features/test_user_use_cases.py

  frontend:
    name: Frontend · build production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx ng build --configuration production

  images:
    name: Images Docker (GHCR)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/rakotoarinosy/bazarstore-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/rakotoarinosy/bazarstore-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Tag = commit (déploiement et retour arrière précis) + latest.
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Déploiement VPS
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copie du docker-compose de production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Mise à jour des conteneurs
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            test -f .env || { echo "::error::$DEPLOY_PATH/.env manquant (voir deploy/README.md)"; exit 1; }
            test -f runtime-config.json || { echo "::error::$DEPLOY_PATH/runtime-config.json manquant"; exit 1; }

            # Version déployée gardée dans .env : un `docker compose up -d` manuel reste sur ce commit.
            if grep -q '^IMAGE_TAG=' .env; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env; else echo "IMAGE_TAG=$IMAGE_TAG" >> .env; fi

            # Images privées : jeton GitHub éphémère de ce déploiement, retiré juste après.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull api web
            docker logout ghcr.io

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps

      - name: Vérification HTTPS
        run: |
          for url in "$API_URL/api/v1/health" "$SITE_URL/" "$SITE_URL/api/v1/health"; do
            echo "→ $url"
            curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          done
          echo "Site et API en ligne."
