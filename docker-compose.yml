# Production BazarStore — déployé dans /srv/BazarStore par GitHub Actions (.github/workflows/ci-cd.yml).
#
#   /srv/BazarStore/docker-compose.yml   ce fichier (copié par la CI)
#   /srv/BazarStore/backend/.env         variables de production (à remplir sur le VPS, modèle :
#                                        deploy/.env.production.example)
#   /srv/BazarStore/.env                 généré par la CI : IMAGE_TAG (commit déployé),
#                                        GOOGLE_CLIENT_ID, API_PORT, WEB_PORT, DB_PORT
#
# Pour le développement local, voir backend/docker-compose.yml et `ng serve`.
# Seul le nginx de l'hôte (HTTPS) atteint les conteneurs : ports publiés sur 127.0.0.1.

name: bazarstore

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: backend/.env # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Accès d'administration uniquement via un tunnel SSH (jamais exposé sur Internet) :
      #   ssh -N -L 15432:127.0.0.1:5434 utilisateur@vps   puis   localhost:15432
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ghcr.io/rakotoarinosy/bazarstore-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # MinIO d'AndaoHiasa sur le même VPS (port 9000 de l'hôte) : MINIO_ENDPOINT=host.docker.internal:9000
      - "host.docker.internal:host-gateway"
    ports:
      # api.bazarstore.rakotoarinosy.com (webhook Stripe, accès direct à l'API)
      - "127.0.0.1:${API_PORT:-8070}:8000"
    logging: *logging

  web:
    image: ghcr.io/rakotoarinosy/bazarstore-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Seule variable utile au site : écrite dans runtime-config.json au démarrage.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      # bazarstore.rakotoarinosy.com (site + /api/ relayé vers le service api)
      - "127.0.0.1:${WEB_PORT:-4270}:80"
    logging: *logging

volumes:
  postgres_data:
