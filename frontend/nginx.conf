# Site Angular + relais de l'API sur la même origine (les appels du front sont en /api/v1/…,
# les cookies de session restent donc « same-site »). Le HTTPS est géré par le nginx de l'hôte.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les images produit (5 Mo max) transitent par l'API.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité du site : posés dans chaque location du site (pas au niveau server,
    # sinon nginx les ajouterait aussi aux réponses de l'API, qui a déjà les siens).

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";

        # Flux temps réel (Server-Sent Events) : pas de tampon, connexions longues.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Configuration injectée au déploiement (identifiant Google) : jamais en cache.
    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Fichiers générés avec une empreinte (outputHashing) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Routes Angular (/my-orders, /backoffice/…) : toujours index.html, jamais en cache.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        try_files $uri $uri/ /index.html;
    }
}
