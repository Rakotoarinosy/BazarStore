<div class="card mb-8!">
    <div class="flex items-center justify-between mb-4">
        <div class="font-semibold text-xl">Chiffre d’affaires · 6 derniers mois</div>
    </div>
    @if (chartData()) {
        <p-chart type="bar" [data]="chartData()" [options]="chartOptions()" class="h-100" />
    } @else {
        <div class="h-100 flex items-center justify-center text-muted-color"><i class="pi pi-spin pi-spinner mr-2"></i> Chargement…</div>
    }
</div>
