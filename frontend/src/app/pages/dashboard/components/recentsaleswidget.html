<div class="card mb-8!">
    <div class="flex items-center justify-between mb-4">
        <div class="font-semibold text-xl">Dernières commandes</div>
        <a class="text-primary font-medium" routerLink="/backoffice/orders">Tout voir <i class="pi pi-arrow-right text-sm"></i></a>
    </div>
    <p-table [value]="stats()?.recent_orders ?? []" [rows]="6" responsiveLayout="scroll">
        <ng-template #header>
            <tr>
                <th>Commande</th>
                <th>Total</th>
                <th>Statut</th>
                <th style="width: 4rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-order>
            <tr>
                <td>
                    <div class="flex items-center gap-3">
                        <img [src]="order.image_url || '/demo/images/product/product-placeholder.svg'" [alt]="order.reference" width="44" height="44" class="shadow-sm rounded-border object-cover" />
                        <div>
                            <div class="font-medium">{{ order.customer_name }}</div>
                            <small class="text-muted-color">{{ order.reference }} · {{ order.item_count }} article(s) · {{ formatRelative(order.created_at) }}</small>
                        </div>
                    </div>
                </td>
                <td class="whitespace-nowrap font-medium">{{ formatAriary(order.total_amount) }}</td>
                <td><p-tag [value]="statusLabel(order.status)" [severity]="statusSeverity(order.status)" /></td>
                <td>
                    <p-button icon="pi pi-search" type="button" [text]="true" ariaLabel="Voir la commande" routerLink="/backoffice/orders" [queryParams]="{ order: order.id }" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr><td colspan="4" class="text-center py-6 text-muted-color">Aucune commande pour le moment.</td></tr>
        </ng-template>
    </p-table>
</div>
