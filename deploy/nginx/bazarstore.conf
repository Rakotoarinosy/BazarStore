# nginx de l'HÔTE — /etc/nginx/sites-available/bazarstore.conf
# HTTPS ajouté ensuite par :  sudo certbot --nginx -d bazarstore.rakotoarinosy.com -d api.bazarstore.rakotoarinosy.com
# Les ports doivent correspondre à WEB_PORT / API_PORT du fichier .env.

# Réglages communs aux deux sites.
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

# ─── Site : bazarstore.rakotoarinosy.com → conteneur web (qui relaie /api/ vers l'API) ───
server {
    listen 80;
    listen [::]:80;
    server_name bazarstore.rakotoarinosy.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;

        # Flux temps réel (Server-Sent Events) des commandes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ─── API : api.bazarstore.rakotoarinosy.com → conteneur api (webhook Stripe, accès direct) ───
server {
    listen 80;
    listen [::]:80;
    server_name api.bazarstore.rakotoarinosy.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
